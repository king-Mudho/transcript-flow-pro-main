# nginx site config for collectmytranscriptmsu.com
#
# Install to: /etc/nginx/conf.d/collectmytranscriptmsu.com.conf
#
# Everything is served from one origin, which means the browser makes no
# cross-origin requests and no CORS configuration is needed anywhere:
#
#   /               -> Node SSR frontend  (127.0.0.1:3000)
#   /api/           -> Django/gunicorn    (127.0.0.1:8000)
#   /django-admin/  -> Django/gunicorn    (127.0.0.1:8000)
#   /django-static/ -> Django admin assets from disk
#
# There is deliberately ONE server block listening on port 80. Do not add a
# separate http->https redirect block by hand: `certbot --nginx --redirect`
# rewrites this file to add the :443 block, the certificate paths and the
# redirect itself. Two overlapping :80 blocks would make nginx discard one and
# could redirect to HTTPS before a certificate exists.

upstream msu_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream msu_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    # default_server means this block also answers requests made directly to the
    # IP address, which is how you verify the deployment before DNS propagates.
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name collectmytranscriptmsu.com www.collectmytranscriptmsu.com
                server1.collectmytranscriptmsu.com 198.54.112.154;

    access_log /var/log/nginx/msu-access.log;
    error_log  /var/log/nginx/msu-error.log;

    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Let certbot answer the HTTP-01 challenge from disk.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------------------------------------------------------------- backend

    location /api/ {
        proxy_pass http://msu_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django reads this to know whether the original request was HTTPS
        # (SECURE_PROXY_SSL_HEADER in settings.py).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Generating the .xlsx export is synchronous and can be slow on a large
        # table, so allow more than the 60s default. Must stay below gunicorn's
        # own timeout (180s in deploy/gunicorn.conf.py).
        proxy_read_timeout 120s;
    }

    location /django-admin/ {
        proxy_pass http://msu_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Django admin CSS/JS, written here by `manage.py collectstatic`.
    location /django-static/ {
        alias /srv/msu/Backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # --------------------------------------------------------------- frontend

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        proxy_pass http://msu_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://msu_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
