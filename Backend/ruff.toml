# Lint config for the Django backend.  Run:  ruff check .   /   ruff format .
line-length = 100
target-version = "py311"

# Migrations are generated by Django and should be left byte-for-byte as emitted;
# the virtualenv is third-party code.
exclude = ["venv", "*/migrations/*"]

[lint]
# Defaults plus a few rule groups that catch real problems in this codebase.
select = ["E", "F", "W", "I", "UP", "B", "DTZ"]

ignore = [
    # Django and DRF declare class-level lists/tuples by convention
    # (permission_classes, list_display, fields, ...). Annotating each one with
    # typing.ClassVar to satisfy this rule would add noise without adding safety.
    "RUF012",
]
